name: Validate and release dist

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require version advancement
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/check-version.ts "$BASE_SHA"
      - name: Build dist
        run: bun run build
      - name: Require committed dist
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "dist is stale. Run 'bun run build' and commit the result."
            exit 1
          fi

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create release archive
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          archive="effect-hatchet-v${version}.tar.gz"
          tar -czf "$archive" dist package.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release create "v$VERSION" "$ARCHIVE" --target "$GITHUB_SHA" --generate-notes
